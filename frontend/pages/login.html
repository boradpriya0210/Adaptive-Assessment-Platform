<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Adaptive Test System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="glass-panel auth-card fade-in">
            <div class="auth-header" style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 2.2rem; margin-bottom: 8px;">Welcome Back</h1>
                <p>Log in to continue your assessment</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div style="position: relative;">
                        <i class="fa fa-envelope" style="position: absolute; left: 16px; top: 16px; color: var(--text-secondary);"></i>
                        <input type="email" id="email" placeholder="name@company.com" style="padding-left: 48px;" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <i class="fa fa-lock" style="position: absolute; left: 16px; top: 16px; color: var(--text-secondary);"></i>
                        <input type="password" id="password" placeholder="••••••••" style="padding-left: 48px;" required>
                    </div>
                </div>

                <div style="margin-bottom: 24px; text-align: right;">
                    <a href="#" class="nav-link" style="font-size: 0.9rem;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; height: 50px;">
                    Sign In <i class="fa fa-arrow-right"></i>
                </button>
            </form>

            <div style="margin-top: 30px; text-align: center; font-size: 0.95rem;">
                <span style="color: var(--text-secondary);">Don't have an account?</span>
                <a href="register.html" class="nav-link" style="color: var(--primary); font-weight: 600; margin-left: 5px;">Create Account</a>
            </div>
        </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
