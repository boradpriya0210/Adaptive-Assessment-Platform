<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test History | Adaptive Test System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .history-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border-color: rgba(79, 70, 229, 0.4);
        }

        .score-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.2), rgba(236, 72, 11, 0.2));
            border: 1px solid rgba(79, 70, 229, 0.3);
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        
        .history-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .empty-history {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }
        
        .empty-history i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="fade-in">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="gradient-text">ADAPTIVE</span>TEST
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fa fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="test.html" class="sidebar-link">
                    <i class="fa fa-play-circle"></i>
                    <span>Start Test</span>
                </a>
                <a href="profile.html" class="sidebar-link">
                    <i class="fa fa-user-circle"></i>
                    <span>Profile</span>
                </a>
                <a href="history.html" class="sidebar-link active">
                    <i class="fa fa-history"></i>
                    <span>History</span>
                </a>
            </nav>
            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--glass-border);">
                <a href="#" id="logout-btn" class="sidebar-link">
                    <i class="fa fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <div>
                    <h1 class="text-2xl font-bold">Your Test History</h1>
                    <p class="text-sm" style="color: var(--text-secondary);">Review your past performances and identify areas to focus on.</p>
                </div>
            </header>

            <div id="history-container" class="history-grid">
                <!-- Data will be loaded via JS -->
                <div class="empty-history" style="grid-column: 1 / -1;">
                    <i class="fa fa-spinner fa-spin"></i>
                    <h2>Loading your history...</h2>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/history.js"></script>
</body>

</html>
