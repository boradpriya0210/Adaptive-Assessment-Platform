<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Adaptive Test System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar glass-panel">
        <div class="nav-logo">ADAPTIVE<span style="color: var(--primary);">TEST</span></div>
        <div class="nav-links">

        </div>
    </nav>

    <main
        style="padding: 120px 20px 40px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;">
        <div class="glass-panel fade-in" style="width: 100%; max-width: 700px; padding: 40px;">
            <div style="text-align: center; margin-bottom: 40px;">
                <div
                    style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(45deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 2.5rem; font-weight: 700; color: white;">
                    <span id="profile-initials">JS</span>
                </div>
                <h2 id="profile-name-title">John Doe</h2>
                <p id="profile-email-title">john.doe@example.com</p>
                <div id="profile-role-badge"
                    style="display: inline-block; padding: 4px 12px; background: rgba(79, 70, 229, 0.1); color: var(--primary); border-radius: 100px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-top: 10px;">
                    User</div>
            </div>

            <form id="profile-form">
                <div class="form-group">
                    <label for="profile-name">Full Name</label>
                    <input type="text" id="profile-name" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <label for="profile-email">Email Address</label>
                    <input type="email" id="profile-email" placeholder="Email Address" readonly
                        style="opacity: 0.6; cursor: not-allowed;">
                    <small style="color: var(--text-secondary); font-size: 0.75rem;">Email cannot be changed</small>
                </div>
                <div class="form-group">
                    <label for="profile-password">New Password (leave blank to keep current)</label>
                    <input type="password" id="profile-password" placeholder="••••••••" minlength="6">
                </div>

                <div style="margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                        <i class="fa fa-save" style="margin-right: 8px;"></i> Update Profile
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="../js/user.js"></script>
</body>

</html>
